<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Complaints | CampusCare</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container py-1">
            <a class="navbar-brand fw-bold fs-4" href="/dashboard.html">
                CampusCare
            </a>

            <div class="d-flex align-items-center gap-2">
                <a href="/dashboard.html"
                   class="btn btn-outline-light btn-sm">
                    Dashboard
                </a>

                <button
                    class="btn btn-light btn-sm text-primary"
                    id="logoutBtn"
                    type="button"
                >
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-4 py-md-5">

        <section class="bg-white rounded-4 shadow-sm p-4 p-md-5 mb-4">
            <span class="badge text-bg-primary mb-3">
                STUDENT PORTAL
            </span>

            <h1 class="fw-bold mb-2">My Complaints</h1>

            <p class="text-secondary mb-4">
                View all your submitted complaints and track their
                latest status.
            </p>

            <a href="/complaint.html" class="btn btn-primary px-4">
                + Submit New Complaint
            </a>
        </section>

        <section>
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <h4 class="fw-bold mb-0">Complaint History</h4>

                <a href="/dashboard.html"
                   class="text-decoration-none small">
                    Back to Dashboard
                </a>
            </div>

            <div id="complaintsContainer">

                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body text-center py-5">

                        <div
                            class="spinner-border text-primary"
                            role="status"
                        >
                            <span class="visually-hidden">Loading...</span>
                        </div>

                        <p class="text-secondary mt-3 mb-0">
                            Loading your complaints...
                        </p>

                    </div>
                </div>

            </div>
        </section>

    </main>

    <footer class="border-top bg-white py-3 mt-5">
        <div class="container text-center">
            <p class="text-secondary small mb-0">
                CampusCare &copy; 2026 · Campus Complaint Management System
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/complaints.js"></script>
    <script src="/js/logout.js"></script>

</body>
</html>
